name: PartyVault CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Build Zig crypto core
        working-directory: zig
        run: zig build

      - name: Run demo
        run: |
          mkdir -p output
          chmod +x run_demo.sh
          ./run_demo.sh 2>&1 | tail -30

      - name: Verify output
        run: |
          test -f output/cleansed_parties.csv
          test -f output/ingestion_report.txt
          echo "✅ Pipeline outputs verified"
