version: '3.8'

services:
  partyvault:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./output:/app/output
      - ./data:/app/data
    environment:
      - PARTYVAULT_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=partyvault
      - POSTGRES_PASSWORD=partyvault_secret
      - POSTGRES_DB=partyvault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  gateway:
    build:
      context: ./gateway
    ports:
      - "8000:8000"
    environment:
      - PARTYVAULT_API=http://partyvault:8080
    depends_on:
      - partyvault

volumes:
  postgres_data:
